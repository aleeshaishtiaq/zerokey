name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend and CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install flake8 pytest

      - name: Lint Python source and tests
        run: python -m flake8 src/ tests/ --max-line-length=100 --extend-ignore=E501

      - name: Run tests
        run: python -m pytest tests/ -q

  build-check:
    name: Check required project files
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify required files and dashboard contents
        run: |
          test -f frontend/index.html
          test -f extension/manifest.json
          test -f src/api/main.py
          test -d dashboard
          test -n "$(find dashboard -type f -print -quit)"
          echo "All required project files are present."
